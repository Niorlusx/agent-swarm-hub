version: 1
rules:
  - branch: main
    protection:
      required_pull_request_reviews:
        required_approving_review_count: 1
        dismiss_stale_reviews: true
        require_code_owner_reviews: false
      required_status_checks:
        strict: true
        checks:
          # Keep these contexts aligned with job names in:
          # .github/workflows/swarm-controller.yml and .github/workflows/ai-automation.yml
          - context: "deploy"
          - context: "automate"
      enforce_admins: false
      restrictions: null
