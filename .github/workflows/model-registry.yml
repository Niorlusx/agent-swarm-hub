name: Ollama Model Registry

on:
  workflow_dispatch:
    inputs:
      models:
        description: "Comma-separated list of models to pull (e.g. llama3.1,mistral,phi3)"
        required: true
        default: "llama3.1,mistral"
  schedule:
    # Weekly refresh of common models
    - cron: "0 4 * * 1"

jobs:
  pull-models:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Start Ollama
        run: |
          docker run -d --name ollama -p 11434:11434 ollama/ollama:latest
          sleep 8
          docker ps

      - name: Pull requested models
        run: |
          MODELS="${{ github.event.inputs.models || 'llama3.1,mistral' }}"
          IFS=',' read -ra MODEL_ARRAY <<< "$MODELS"
          for model in "${MODEL_ARRAY[@]}"; do
            model=$(echo "$model" | xargs)
            echo "Pulling model: $model"
            docker exec ollama ollama pull "$model"
          done

      - name: List available models
        run: docker exec ollama ollama list

      - name: Health check
        run: |
          curl -sf http://localhost:11434/api/tags | jq .

      - name: Stop Ollama
        if: always()
        run: docker stop ollama || true
