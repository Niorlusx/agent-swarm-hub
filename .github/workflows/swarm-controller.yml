name: AI Swarm Controller

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Initialize Swarm
        run: |
          set -euo pipefail
          RUN_ID="${{ github.run_id }}"
          if ! [[ "${RUN_ID}" =~ ^[0-9]+$ ]]; then
            echo "::error::Invalid github.run_id value: ${RUN_ID}"
            exit 1
          fi

          mkdir -p .swarm/state .swarm/logs .swarm/agents
          printf '{"status":"ACTIVE","updated_at":"%s","run_id":"%s"}\n' "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" "${RUN_ID}" > .swarm/state/swarm.json
          echo "Swarm Controller activated at $(date -u +'%Y-%m-%dT%H:%M:%SZ')"

      - name: Log deployment
        run: |
          set -euo pipefail
          printf '[%s] Swarm deployment run_id=%s actor=%s ref=%s\n' \
            "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            "${{ github.run_id }}" \
            "${{ github.actor }}" \
            "${{ github.ref_name }}" >> .swarm/logs/deploy.log

      - name: Deploy Agents
        run: |
          set -euo pipefail
          echo "AI Agents deploying..."
          echo "Phase 2: INVADE initiated"

      - name: Commit and push state updates
        run: |
          set -euo pipefail
          trap 'echo "::error::Deployment commit failed on line $LINENO"' ERR

          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .swarm/state/swarm.json

          if git diff --cached --quiet; then
            echo "No deployment changes to commit."
            exit 0
          fi

          git commit -m "DEPLOY: Swarm Controller state update [skip ci]"
          # Values are injected from this step's env block.
          max_attempts="${PUSH_MAX_ATTEMPTS}"
          retry_delay="${PUSH_RETRY_DELAY_SECONDS}"

          for ((attempt=1; attempt<=max_attempts; attempt++)); do
            if git push origin "HEAD:${{ github.ref_name }}"; then
              echo "Push succeeded on attempt ${attempt}."
              exit 0
            fi

            if [[ "${attempt}" -lt "${max_attempts}" ]]; then
              echo "Push failed on attempt ${attempt}, retrying in ${retry_delay} seconds..."
              sleep "${retry_delay}"
            fi
          done

          echo "::error::Push failed after ${max_attempts} attempts."
          exit 1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUSH_MAX_ATTEMPTS: "3"
          PUSH_RETRY_DELAY_SECONDS: "5"